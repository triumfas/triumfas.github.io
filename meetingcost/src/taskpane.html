<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Cost</title>
    <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
    <style>
      :root {
        --page: #f6f6f4;
        --card: #ffffff;
        --card-border: rgba(0, 35, 70, 0.08);
        --surface: rgba(237, 237, 233, 0.5);
        --surface-subtle: rgba(237, 237, 233, 0.5);
        --text: #002346;
        --amount: #000000;
        --muted: rgba(0, 35, 70, 0.64);
        --row-border: rgba(0, 35, 70, 0.16);
        --link: #0060e8;
        --unsaved: #c75b00;
        --error: #c4314b;
        --input-bg: #ffffff;
        --input-border: rgba(0, 35, 70, 0.32);
        --feedback-icon: url("../assets/feedback-light.svg");
        --logo: url("../assets/danske-logo-light.svg");
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #ededeb;
          --card: #303030;
          --card-border: rgba(255, 255, 255, 0.16);
          --surface: #404040;
          --surface-subtle: #303030;
          --text: #ffffff;
          --amount: #ffffff;
          --muted: #ffffff;
          --row-border: rgba(255, 255, 255, 0.16);
          --link: #0060e8;
          --unsaved: #ff9b42;
          --error: #ff8fa3;
          --input-bg: #404040;
          --input-border: rgba(255, 255, 255, 0.32);
          --feedback-icon: url("../assets/feedback-dark.svg");
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 24px 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 16px;
      }
      .brand { height: 18px; margin-top: 24px; display: flex; align-items: center; justify-content: space-between; }
      .brand i { display: block; width: 118px; height: 12px; background: var(--logo) no-repeat left center / contain; }
      .brand img { display: block; width: 77px; height: 18px; }
      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        padding: 20px 20px 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .title { display: flex; align-items: center; gap: 6px; margin: 0 0 16px; font-size: 18px; font-weight: 600; color: var(--amount); }
      .title img { width: 24px; height: 24px; }
      .head { display: flex; flex-direction: column; }
      .total { background: var(--surface); border-radius: 6px; padding: 20px 8px; text-align: center; font-weight: 600; }
      .total .label { font-size: 16px; color: var(--muted); }
      .amount { margin-top: 6px; font-size: 48px; line-height: normal; color: var(--amount); }
      .stats { display: flex; gap: 12px; }
      .stat { flex: 1 1 0; min-width: 0; background: var(--surface); border-radius: 6px; padding: 12px; font-weight: 600; }
      .stat span { display: block; font-size: 16px; color: var(--muted); }
      .stat b { display: block; margin-top: 4px; font-size: 18px; font-weight: 600; color: var(--text); }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--row-border); font-size: 16px; }
      li:first-child:not(:last-child) { border-bottom-color: var(--card-border); }
      li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li .rate { flex: none; white-space: nowrap; }
      li .rate small { font-size: 14px; color: var(--muted); }
      .totals { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-top: 8px; font-weight: 600; }
      .totals > span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .totals > span:last-child { flex: none; white-space: nowrap; }
      .totals .detail { margin-left: 4px; font-weight: 400; color: var(--muted); }
      .error { color: var(--error); font-size: 14px; }
      details { font-size: 14px; }
      summary { cursor: pointer; font-weight: 600; }
      .field { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
      input, button { font: inherit; color: var(--text); background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 5px 10px; min-width: 0; }
      input[type="checkbox"] { padding: 0; accent-color: var(--link); }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .6; }
      .unsaved { border-color: var(--unsaved); box-shadow: inset 0 0 0 1px var(--unsaved); }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      #saveStatus { color: var(--muted); margin-top: 6px; }
      .feedback {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px;
        background: var(--surface-subtle);
        border: 1px solid var(--card-border);
        border-radius: 6px;
      }
      .feedback > div { flex: 1 1 0; min-width: 0; }
      .feedback h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
      .feedback p { margin: 0; color: var(--muted); }
      .feedback .link { padding: 0; border: 0; background: none; color: var(--link); text-decoration: underline; font-size: 16px; }
      .feedback .link:disabled { color: var(--muted); text-decoration: none; }
      .feedback i { flex: none; width: 60px; height: 60px; background: var(--feedback-icon) no-repeat center / contain; }
    </style>
  </head>
  <body>
    <div class="brand" role="img" aria-label="Danske Bank"><i></i><img src="../assets/danske-mark.svg" alt="" /></div>
    <div class="card">
      <div class="head">
        <h1 class="title"><img src="../assets/calculator.svg" alt="" />Meeting cost calculator</h1>
        <div class="total">
          <div class="label">Total meeting cost</div>
          <div class="amount" id="amount">&ndash;</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>Attendees</span><b id="people">&ndash;</b></div>
        <div class="stat"><span>Duration</span><b id="hours">&ndash;</b></div>
      </div>
      <div>
        <ul id="list"></ul>
        <div class="totals">
          <span><span>Total</span><span class="detail" id="totalDetail"></span></span>
          <span id="totalValue">&ndash;</span>
        </div>
      </div>
      <div class="error" id="error" hidden></div>
      <details>
        <summary>Settings</summary>
        <div class="field">
          <label for="includeOptional">Include optional participants</label>
          <input id="includeOptional" type="checkbox" />
        </div>
        <div class="actions">
          <button type="button" id="save">Save</button>
          <button type="button" id="reset">Reset</button>
        </div>
        <div id="saveStatus"></div>
      </details>
    </div>
    <div class="feedback">
      <div>
        <h3>Leave feedback</h3>
        <p>Have an idea or spotted an issue? <button type="button" class="link" id="feedback">Let us know</button></p>
      </div>
      <i aria-hidden="true"></i>
    </div>
    <script src="taskpane.js?v=20261111-2"></script>
  </body>
</html>
